services:
  opencode-free-gate:
    build: .
    image: opencode-free-gate:latest
    container_name: opencode-free-gate
    restart: unless-stopped
    ports:
      - "13339:13339"
    environment:
      - PORT=13339
      # 自定义代理列表（推荐配置海外住宅代理、SOCKS5 或 HTTP 代理，多个逗号分隔）
      # - CUSTOM_PROXIES=socks5://127.0.0.1:10808,http://user:pass@ip:port
      # 代理重试顺序（custom 自定义代理优先，public 公共代理，zen 备选中继）
      # - PROXY_ORDER=custom,public,zen
      # OpenCode 官方 API 密钥（可选，配置后直通上游认证并免除免费层客户端校验）
      # - OPENCODE_API_KEY=你的密钥
      # ZenProxy 备用中继（可选，全部代理失败时降级使用）
      # - ZENPROXY_KEY=你的密钥
      # - ZENPROXY_RELAY=https://zenproxy.top/api/relay
      # 强制走 relay 模式（调试用，1=开启）
      # - FORCE_RELAY=0
      # 探活超时（ms）
      # - PROXY_PROBE_TIMEOUT=8000
      # 公共代理源（默认集成 proxy.scdn.io 代理池，支持 get_proxy.php 与 text.php，可逗号分隔多源）
      # - PROXY_API=https://proxy.scdn.io/api/get_proxy.php?protocol=all&count=100,https://proxy.scdn.io/text.php
      # 候选池刷新间隔（ms，5 分钟）
      # - PROXY_REFRESH_MS=300000
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://127.0.0.1:13339/healthz"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 10s
